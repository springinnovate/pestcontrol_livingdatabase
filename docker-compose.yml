x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ./app
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${PCLD_DATA_PATH:-/srv/apps/pcld/data}
        target: /usr/local/data
      - type: bind
        source: ${PCLD_GOOGLE_CREDENTIALS_PATH:-/srv/apps/pcld/secrets/service-account-key.json}
        target: /run/secrets/google-service-account-key.json
        read_only: true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 1G
          cpus: "2"
    command:
      - waitress-serve
      - --host=0.0.0.0
      - --port=5000
      - app:app
    expose:
      - "5000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      INIT_COVARIATES: "True"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account-key.json
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  celery_worker:
    build:
      context: ./app
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${PCLD_DATA_PATH:-/srv/apps/pcld/data}
        target: /usr/local/data
      - type: bind
        source: ${PCLD_GOOGLE_CREDENTIALS_PATH:-/srv/apps/pcld/secrets/service-account-key.json}
        target: /run/secrets/google-service-account-key.json
        read_only: true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    command:
      - celery
      - -A
      - app.celery
      - worker
      - --loglevel=info
      - --concurrency=4
      - --max-tasks-per-child=10
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      INIT_COVARIATES: "False"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account-key.json

  redis:
    image: redis:alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
